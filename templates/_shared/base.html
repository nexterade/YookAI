<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e1a">
  <meta name="application-version" content="0.3.8">
  <title>{% block title %}YookAI{% endblock %}</title>
  <script>(function(){try{var t=localStorage.getItem('yookai-theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);}else{var p=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',p?'dark':'light');}}catch(e){}})();</script>
  <style>{% block styles %}{% endblock %}</style>
  {% block head_extra %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  <script>{% block scripts %}{% endblock %}</script>
  {% block body_extra %}{% endblock %}
</body>
</html>
